name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: invariants (v2 enterprise modules)
        run: |-
          node tools/gen-logs.js --lines 2000 --seed 42 --out /tmp/sample.jsonl
          node tools/ci-invariants.js
